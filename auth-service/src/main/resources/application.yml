server:
  port: 8082

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/flight_auth_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-base-url: http://localhost:5173

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

jwt:
  secret: YOUR_VERY_LONG_SECRET_KEY_FOR_FLIGHT_BOOKING_SYSTEM_2026
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

