
server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://mysql:3306/flight_booking_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

flight-service:
  url: http://flight-service:8083

payment-service:
  url: http://payment-service:8085
