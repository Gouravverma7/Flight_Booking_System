server:
  port: 8084

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://localhost:3306/flight_booking_db
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Flight Service
flight-service:
  url: http://localhost:8083

payment-service:
  url: http://localhost:8085

jwt:
  secret: YOUR_VERY_LONG_SECRET_KEY_FOR_FLIGHT_BOOKING_SYSTEM_2026

