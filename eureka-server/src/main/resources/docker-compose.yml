
services:
  # Service discovery
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        JAR_FILE: eureka-server/target/*.jar
    container_name: flight-eureka
    ports:
      - "8761:8761"
    networks:
      - flight-network
    restart: unless-stopped

  # MySQL database
  mysql:
    image: mysql:8.4
    container_name: flight-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - flight-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  flight-network:
    driver: bridge

volumes:
  mysql_data:
