
server:
  port: 8085

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://mysql:3306/flight_payment_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

booking-service-url: http://booking-service:8084
notification-service-url: http://notification-service:8087
