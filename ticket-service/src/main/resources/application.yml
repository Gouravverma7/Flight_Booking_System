server:
  port: 8086

spring:
  application:
    name: ticket-service
  datasource: 
    url: jdbc:mysql://localhost:3306/flight_ticket_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

booking-service:
  url: http://localhost:8084

flight-service:
  url: http://localhost:8083

ticket:
  storage-path: ./tickets